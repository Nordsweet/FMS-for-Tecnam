<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Traffic</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07111f;
    }

    .traffic-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .traffic-map {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #07111f;
    }
  </style>
</head>
<body>
  <main class="traffic-shell">
    <iframe
      class="traffic-map"
      title="Live traffic map"
      src="./airspaces.html?embed=1&amp;traffic=1&amp;trafficOnly=1"
      loading="eager"></iframe>
  </main>
</body>
</html>
